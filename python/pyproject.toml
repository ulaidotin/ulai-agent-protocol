[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ulai-agent-protocol"
version = "0.1.0"
description = "Generated protobuf and gRPC code for the Ulai agent API (ulai.agent.v1)"
requires-python = ">=3.10"
dependencies = [
  # Generated by grpcio-tools 1.85.1 (protobuf gencode 7.35.1).
  "protobuf>=7.35.1,<8",
  "grpcio>=1.85.1",
]

[tool.hatch.build.targets.wheel]
# ulai/ and ulai/agent/ are namespace packages (no __init__.py).
packages = ["src/ulai"]
